name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # namespaces and per-sandbox users need root; the probe prints what the runner allows
      - run: sudo -E env "PATH=$PATH" python -m crucible.probe
      - run: sudo -E env "PATH=$PATH" python -m pytest -q tests
      - run: sudo -E env "PATH=$PATH" python bench/spawn.py
